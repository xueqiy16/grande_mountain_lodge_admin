name: Supabase Keep-Alive

on:
  schedule:
    # Daily at 06:00 UTC — well within Supabase's 7-day inactivity pause window.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing required secrets: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          http_code=$(curl -sS -o /tmp/supabase-ping-response.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/rooms?select=room_id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          if [ "$http_code" -ne 200 ]; then
            echo "Keep-alive ping failed with HTTP ${http_code}"
            cat /tmp/supabase-ping-response.txt
            exit 1
          fi

          echo "Keep-alive ping succeeded (HTTP ${http_code})"
